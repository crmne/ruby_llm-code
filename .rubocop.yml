plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - docs/**/*
    - vendor/**/*
    - gemfiles/**/*
  SuggestExtensions: false

Naming/FileName:
  Exclude:
    - lib/ruby_llm-code.rb
    - lib/ruby_llm-code.minimal.rb

Metrics/ClassLength:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false